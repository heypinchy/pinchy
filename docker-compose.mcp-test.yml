# docker-compose.mcp-test.yml
# Test overlay: adds a mock MCP server for the native-MCP E2E tests.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.mcp-test.yml up --build -d

services:
  mcp-mock:
    build:
      context: config/mcp-mock
    ports:
      - "9007:9007"
    environment:
      PORT: "9007"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9007/control/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  pinchy:
    environment:
      # Enable the MCP integration feature for E2E tests. Server-side runtime
      # flag only — there is deliberately no NEXT_PUBLIC_ counterpart (see
      # src/lib/feature-flags.ts and D3 in
      # docs/plans/2026-06-30-mcp-port-to-main.md): a NEXT_PUBLIC_* var would
      # be inlined at Docker image BUILD time, which this E2E job's pre-built
      # image already went through — setting it here would have no effect on
      # the UI, only silently arm the API.
      - PINCHY_MCP_ENABLED=1
      # Allow private URLs so the MCP credential proxy (and tool discovery/
      # sync, both done directly by the Pinchy container) can reach the
      # internal mcp-mock container — mirrors the self-hosted "internal MCP
      # server" allowance docker-compose.odoo-test.yml makes for odoo-mock.
      - ALLOW_PRIVATE_URLS=1
      # Emit a dummy ollama-local API key so the fake-LLM provider gets a
      # portable static auth profile — new dispatch agents inherit it,
      # otherwise the round-trip agent fails with "No API key found for
      # provider ollama". Same flag the web/odoo/email/integration dispatch
      # stacks set.
      - PINCHY_E2E_OLLAMA_LOCAL_API_KEY=1
    extra_hosts:
      # Allows Pinchy (Docker) to fetch the Ollama model list from fake-Ollama
      # on the host during regenerateOpenClawConfig(). OpenClaw already has
      # this mapping via the base docker-compose.yml extra_hosts block.
      - "ollama.local:host-gateway"
