name: Configure Docker Hub mirror
description: >
  Sidesteps Docker Hub's pull rate limit (CI hit it consistently as of
  2026-05-01 even when authenticated, at 200 pulls/6h; anonymous pulls get
  less) by pulling the Docker Hub library images
  Pinchy depends on directly from mirror.gcr.io and re-tagging them locally.
  After this action runs, `docker compose pull` / `up` finds the images in
  the local cache and never touches docker.io.

  Why pre-pull beats `registry-mirrors` alone: a daemon-level mirror config
  silently falls back to docker.io on any mirror miss / lookup hiccup. That
  fallback still consumes rate-limit quota — verified in CI runs 25224536490
  and 25222971253 where `db Error toomanyrequests` fired even with
  registry-mirrors set. Pre-pulling keeps the docker.io path out of the
  normal run for the images we control.

  mirror.gcr.io itself has transient misses ("could not fetch content
  descriptor sha256:… from remote: not found" — three CI runs lost in one
  afternoon), so pull-via-mirror.sh retries each mirror pull with backoff and
  only then, as a last resort, pulls that one image from docker.io with a
  ::warning::. That fallback is authenticated only if the job logged in to
  Docker Hub BEFORE this action (the ci.yml jobs that log in do); otherwise it
  is anonymous, with Docker Hub's tighter anonymous limit, and can itself be
  rate-limited. A likely success still beats failing the job on a mirror
  blip; the warning keeps it from becoming the quiet norm. Retries are plain
  log lines, so the ~10-annotations-per-step cap cannot drop that warning.
runs:
  using: composite
  steps:
    - name: Configure Docker daemon registry mirror (defense-in-depth)
      shell: bash
      run: |
        sudo mkdir -p /etc/docker
        echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo systemctl restart docker
        until docker info >/dev/null 2>&1; do sleep 1; done

    - name: Pre-pull Docker Hub library images via mirror.gcr.io
      shell: bash
      run: |
        # Auto-discover docker.io library images across all
        # docker-compose*.yml so this stays correct when new services
        # are added without anyone touching this action. The regex
        # matches `image: <name>:<tag>` lines where <name> has no `/`
        # (i.e. no registry prefix → defaults to docker.io/library/<name>)
        # and no `${...}` interpolation. The daemon mirror is defense-
        # in-depth for anything this discovery misses.
        images=$(
          grep -hE '^[[:space:]]+image:[[:space:]]+[a-z0-9_.-]+:[a-z0-9_.-]+[[:space:]]*$' docker-compose*.yml \
            | awk '{print $NF}' \
            | sort -u
        )
        if [ -z "$images" ]; then
          echo "::warning::No docker.io library images discovered in docker-compose*.yml — pre-pull skipped. If your stack pulls library images, the daemon mirror is your only line of defense."
        else
          # shellcheck disable=SC2086 # word-splitting is intentional here
          echo "Pre-pulling docker.io library image(s) via mirror.gcr.io:" $images
          # shellcheck disable=SC2086 # one argument per discovered image
          bash "$GITHUB_ACTION_PATH/pull-via-mirror.sh" $images
        fi

        # Same idea for docker.io *namespaced* (non-library) images, e.g.
        # pgvector/pgvector:pg17 (docker-compose.yml's `db` service — a
        # drop-in postgres:17 replacement bundling the pgvector extension).
        # The namespace segment is required to contain no dot/colon so this
        # doesn't false-match registry-hosted refs like
        # ghcr.io/heypinchy/pinchy:${PINCHY_VERSION} (which also carries
        # `${...}` interpolation the tag group can't match anyway).
        namespaced_images=$(
          grep -hE '^[[:space:]]+image:[[:space:]]+[a-z0-9_-]+/[a-z0-9._-]+:[a-z0-9_.-]+[[:space:]]*$' docker-compose*.yml \
            | awk '{print $NF}' \
            | sort -u
        )
        if [ -z "$namespaced_images" ]; then
          echo "::warning::No docker.io namespaced images discovered in docker-compose*.yml — pre-pull skipped. If your stack pulls namespaced Docker Hub images, the daemon mirror is your only line of defense."
        else
          # shellcheck disable=SC2086 # word-splitting is intentional here
          echo "Pre-pulling docker.io namespaced image(s) via mirror.gcr.io:" $namespaced_images
          # shellcheck disable=SC2086 # one argument per discovered image
          bash "$GITHUB_ACTION_PATH/pull-via-mirror.sh" $namespaced_images
        fi
