name: Reclaim Docker disk before a rebuild
description: >
  Frees the runner's disk so a job that already pulled (or built) the Pinchy
  and OpenClaw images can build them again, and fails with a clear error if
  the build still would not fit.

  docker-smoke is the job this exists for: it pulls the pre-built production
  images, tests them, tears the stack down — which removes containers and
  volumes but no images — and then runs the dev stack with `up --build`,
  which builds Dockerfile.pinchy.dev and Dockerfile.openclaw from scratch.
  The second OpenClaw build ran out of space while copying /opt/llama-cpp-deps
  ("ResourceExhausted: failed to copy files: copy file range failed: no space
  left on device", CI run 42014766282).

  It failed only on AWS-hosted runners: of 31 docker-smoke attempts on
  2026-11-05, all three on AWS died of ENOSPC; of the 28 on Azure, 27 passed
  and one failed for an unrelated reason. An
  Azure ubuntu-26.04 runner has a 145G root with 88G free at job start, so
  that half never came close. Measured there (PR #1293): pulling the two CI
  images costs ~10G, and the dev build alone ~16G (58G -> 74G on the disk; the
  two built images are 4.5G + 3.3G, the rest is BuildKit cache, which
  `docker system df` counts partly twice).

  So this action frees two things, each with a reason:
  - every ghcr.io/heypinchy/* image and bare pinchy* tag. A pulled image is
    not an input to the rebuild — a plain `docker build` does not use one as
    cache — so removing it costs nothing but the space. The BuildKit cache is
    kept on purpose: on a fork PR it holds the local prod builds, so removing
    their tags frees little there, but the dev build of Dockerfile.openclaw
    (same file, same context) reuses that cache and adds almost nothing.
    Callers on that path pass a lower `min-free-gb`.
  - preinstalled toolchains no Pinchy job uses: .NET (5.8G), the Android SDK
    (12G), GHC/ghcup (3.7G) and CodeQL's bundle in the tool cache. The rest of
    /opt/hostedtoolcache stays: setup-node and friends read it.

  Then it requires `min-free-gb` free on the filesystems holding Docker's data
  root and containerd's (/var/lib/containerd — the image store the hosted
  runners use keeps layers there), not just on /. Below that it fails naming the shortfall, instead
  of letting the build die halfway through a COPY.
inputs:
  min-free-gb:
    description: >
      Free space the next build needs on the filesystems holding Docker's and
      containerd's data, in whole GB. Default: the 16G dev build measured on Azure, plus
      headroom for growth — an estimate. If a build runs out of space after
      passing it, raise it from the printed df.
    default: "22"
runs:
  using: composite
  steps:
    - name: Remove Pinchy images and unused toolchains
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
      run: |
        set -euo pipefail
        # With the containerd image store (what the hosted runners use) image
        # layers and BuildKit snapshots live under /var/lib/containerd, not the
        # Docker data root, so measure both and judge the tighter one.
        dirs=$(docker info -f '{{.DockerRootDir}}')
        [ -d /var/lib/containerd ] && dirs="$dirs /var/lib/containerd"
        echo "== before (measuring: $dirs) =="
        # shellcheck disable=SC2086 # one path per word
        df -h / $dirs
        docker system df
        # Every repository under ghcr.io/heypinchy — the -ci refs a job pulled,
        # the :latest tags compose reads, the images a fork-PR fallback built —
        # and the bare `pinchy*` tags some jobs build (`pinchy:e2e`). Filters on
        # the same key are ORed. `pinchy*` also matches mocks compose built
        # under the `pinchy` project name; those are small and rebuilt on the
        # next `up`. Pulled third-party images (postgres, caddy) stay.
        ids=$(docker image ls --filter 'reference=ghcr.io/heypinchy/*' --filter 'reference=pinchy*' --format '{{.ID}}' | sort -u)
        if [ -n "$ids" ]; then
          # shellcheck disable=SC2086 # one ID per word
          docker image rm -f $ids
        fi
        start=$(date +%s)
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        echo "removed unused toolchains in $(( $(date +%s) - start ))s"
        echo "== after =="
        # shellcheck disable=SC2086 # one path per word
        df -h / $dirs
        docker system df
        if ! [[ "$MIN_FREE_GB" =~ ^[0-9]+$ ]]; then
          echo "::error::min-free-gb must be a whole number of GB, got '$MIN_FREE_GB'"
          exit 1
        fi
        for dir in $dirs; do
          # MiB, not GiB: `df -BG` rounds up, so 21.1G would pass a 22G floor.
          free_mb=$(df --output=avail -BM "$dir" | tail -1 | tr -dc '0-9')
          if ! [[ "$free_mb" =~ ^[0-9]+$ ]]; then
            echo "::error::cannot read free space on $dir (got '$free_mb')"
            exit 1
          fi
          if [ "$free_mb" -lt $(( MIN_FREE_GB * 1024 )) ]; then
            echo "::error::only $(( free_mb / 1024 ))G free on $dir after reclaiming, the next build needs ${MIN_FREE_GB}G — see the df output above for what holds the rest"
            exit 1
          fi
          echo "$(( free_mb / 1024 ))G free on $dir (need ${MIN_FREE_GB}G)"
        done
