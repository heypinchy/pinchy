# Vulnerabilities in devDependencies that do not ship in the production Docker
# image. These packages are only present in the lockfile because
# openclaw (added as a devDependency for the schema-validation
# integration test) pulls them in.
#
# Careful: the SAME openclaw version is also the runtime of the OpenClaw image,
# which installs it with `npm install -g` (Dockerfile.openclaw). That install
# reads neither this lockfile nor the root `pnpm.overrides`, and openclaw pins
# several dependencies exactly. A root override therefore clears the scanner for
# openclaw's dev tree only; the image keeps whatever openclaw pins. Before
# accepting or overriding a finding that routes through openclaw, check its
# pinned version (`npm view openclaw@<version> dependencies`) — the real fix
# for those is an openclaw bump (update-openclaw skill).
#
# MAL-2026-3432, GHSA-w5hq-g745-h8pq (uuid) and GHSA-q8mj-m7cp-5q26 (qs) were
# dropped 2026-07-21: osv-scanner reported them as UNUSED (fail-on-unused) — no
# lockfile package matches them anymore. GHSA-v2v4-37r5-5v8g stays (still used;
# MAL-2026-3432 is one of its aliases, so it remains covered). Re-add with a
# fresh reason if osv-scanner flags any of them again.

[[IgnoredVulns]]
id = "GHSA-v2v4-37r5-5v8g"
reason = "Transitive devDep via openclaw (test tool only — not in production build)"

# astro (docs/pnpm-lock.yaml) is the static-site generator that builds the
# documentation site AT BUILD TIME. It ships in no runtime image and reaches no
# Pinchy user. Beyond that, none of the residual advisories reaches the site we
# ship: three are XSS bugs and one an authorization bypass in base-path
# stripping, all scoped upstream to on-demand SSR / the dev server — statically
# prerendered output, which is all Starlight emits, is explicitly unaffected.
# The fifth (GHSA-26w7, RCE through AVIF optimization) is a libheif bug inside
# sharp: the build only ever optimizes images committed to this repository, and
# the vulnerable code is patched regardless, because docs/package.json forces
