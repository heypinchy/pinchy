# OSV Scanner configuration
# https://google.github.io/osv-scanner/configuration/

# Vulnerabilities in devDependencies that do not ship in the production Docker
# image. These packages are only present in the lockfile because
# openclaw (added as a devDependency for the schema-validation
# integration test) pulls them in.
#
# Careful: the SAME openclaw version is also the runtime of the OpenClaw image,
# which installs it with `npm install -g` (Dockerfile.openclaw). That install
# reads neither this lockfile nor the root `pnpm.overrides`, and openclaw pins
# several dependencies exactly. A root override therefore clears the scanner for
# openclaw's dev tree only; the image keeps whatever openclaw pins. Before
# accepting or overriding a finding that routes through openclaw, check its
# pinned version (`npm view openclaw@<version> dependencies`) — the real fix
# for those is an openclaw bump (update-openclaw skill).
#
# MAL-2026-3432, GHSA-w5hq-g745-h8pq (uuid) and GHSA-q8mj-m7cp-5q26 (qs) were
# dropped 2026-07-21, and GHSA-v2v4-37r5-5v8g (with MAL-2026-3432 as its alias)
# on 2026-10-17: osv-scanner reported each of them as UNUSED (fail-on-unused) —
# no lockfile package matches them anymore. Re-add with a fresh reason if
# osv-scanner flags any of them again.

# The five astro advisories (GHSA-4g3v-8h47-v7g6, GHSA-7pw4-f3q4-r2p2,
# GHSA-f48w-9m4c-m7f5, GHSA-26w7-cxv4-gfx2, GHSA-376h-93r7-7g6f) were retired
# 2026-10-19 by the docs' move to astro 7 + Starlight 0.42 (#851), which ships
# every fix; osv-scanner reports none of them against docs/pnpm-lock.yaml.

# GHSA-mh99-v99m-4gvg (brace-expansion OOM) was retired 2026-10-17. The
# root package.json overrides now lift every line past its fix (1.x >=1.1.21,
# 2.x >=2.1.7, 5.x >=5.0.12), osv-scanner reported the entry as UNUSED, and
# `pnpm audit --audit-level=high --prod` passes without its `ignoreGhsas`
# mirror. The OpenClaw image's plugin installs (`npm install`, no lockfile, no
# overrides) are fixed too, because each line's newest patch is the fixed one
# and the consumers' ranges reach it. Should brace-expansion be flagged again,
# the acceptance needs both halves back — an entry here AND in
# `pnpm.auditConfig.ignoreGhsas` — which scripts/lib/audit-ignore-parity
# .test.mjs (`pnpm test:scripts`) enforces.

# Two advisories published in the 2026-10 wave have NO fixed release at all —
# both ranges are "through the latest version" — so no bump or override can
# clear them. Neither reaches Pinchy at runtime, and neither is in the range
# `pnpm audit --audit-level=high --prod` fails on (braces is dev-only, sprintf-js
# is moderate), so neither needs an `ignoreGhsas` mirror. ignoreUntil forces a
# re-triage in three months, by which time either upstream ships a fix or the
# consuming chain has moved.
#
# braces (GHSA-vfj7, stack-exhaustion DoS through deeply nested patterns):
# reached only via eslint-config-next > @next/eslint-plugin-next > fast-glob >
# micromatch — the lint toolchain, a devDependency that never reaches the runtime
# image (only the dev image and the build stage install it). The
# patterns it expands are the code-authored globs in our eslint config.
#
# sprintf-js 1.0.3 (GHSA-hp3w, DoS through unbounded precision specifiers in an
# attacker-controlled FORMAT string): reached via mammoth > argparse@1, a
# production dependency of pinchy-files and web. argparse is required only by
# mammoth's `bin/mammoth` CLI; `lib/index.js`, which is what Pinchy imports to
# read DOCX files, never loads it. And argparse's own sprintf calls use format
# strings written in argparse, never document content.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-15
reason = "braces <=3.0.3, no fixed release exists. Reached only via eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch (lint toolchain, devDependency: present in the dev image and the build stage, absent from the runtime image); the patterns expanded are code-authored eslint config globs, never attacker input."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2027-01-15
reason = "sprintf-js <=1.1.3, no fixed release exists. Reached via mammoth > argparse@1 (pinchy-files, web), but argparse is loaded only by mammoth's bin/mammoth CLI — lib/index.js, which Pinchy imports, never requires it — and argparse's sprintf format strings are its own literals, never document content."

# Two docs-build-only advisories whose fix exists only in a major the consuming
# package does not declare. Overriding past the declared range was tried (#1222)
# and rejected: it pins versions mermaid / expressive-code never tested, and every
# future bump of either inherits the out-of-range pin. Both are unreachable, so
# an expiring acceptance is the smaller risk. Re-triage when mermaid declares
# katex >=0.18.2 or expressive-code moves postcss-nested to postcss-selector-parser 7.
#
# Related, recorded here so the next triage starts from it: docs resolves
# http-cache-semantics 4.3.0, which is OUTSIDE GHSA-ch52-4w7c-c8xp's published
# range (<= 4.2.0) but does NOT fix it — 4.2.0..4.3.0 upstream only touches Vary
# handling; max-stale still serves a zeroed shared Set-Cookie response. If the
# advisory is widened to cover 4.3.0, accept it on the same grounds: astro uses
# it for its build-time remote-image cache, a private cache with no user cookies.

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2027-01-15
reason = "katex <0.18.2 prototype-pollution trust bypass (low), docs/pnpm-lock.yaml only, via @pasqal-io/starlight-client-mermaid > mermaid (declares katex ^0.16.45). mermaid loads katex lazily in the browser only to render $$ math in diagram labels; the docs' single Mermaid diagram has none, so katex never runs. Fix exists only in 0.18.x, outside mermaid's declared range."

[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
ignoreUntil = 2027-01-15
reason = "postcss-selector-parser <7.1.6 quadratic selector parsing (medium), docs/pnpm-lock.yaml only, via @astrojs/starlight > astro-expressive-code > @expressive-code/core > postcss-nested@6 (declares ^6.1.1). It parses expressive-code's own code-block theme CSS at docs build time; no untrusted selector reaches it and nothing ships it to a user. Fix exists only in 7.x, outside postcss-nested's declared range."
