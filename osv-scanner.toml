ignoreUntil = 2026-10-21
reason = "astro@6.4.8; XSS via unescaped attribute names, requires an SSR runtime with a global HTMLElement — not reachable in Starlight's static output. Fixed only in 7.0.6 (major). Docs-only site, not in the Pinchy production image. Tracked in #851."

