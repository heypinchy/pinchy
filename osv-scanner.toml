# OSV Scanner configuration
# https://google.github.io/osv-scanner/configuration/

# openclaw is in the lockfile twice over: as a devDependency of packages/web
# (the schema-validation integration test) and as the only dependency of
# packages/openclaw-runtime, which IS the runtime of the OpenClaw image —
# Dockerfile.openclaw installs it from this lockfile with --frozen-lockfile. So
# a finding routed through openclaw ships in production, and a root
# `pnpm.overrides` entry is a real fix for what openclaw IMPORTS: the image gets
# the overridden version. Bound such an override to the dependent's major
# (openclaw-runtime-closure.test.ts fails otherwise).
#
# It is NOT a fix for what openclaw BUNDLES. openclaw's dist/ is a rolldown
# bundle that inlines some of its dependencies (`//#region node_modules/<pkg>/`
# in dist/*.js) — zod, protobufjs, semver, qs, @smithy/core and others. The
# lockfile still lists them, so an override turns this scanner green, but the
# inlined copy is the code the gateway runs and no override reaches it. Check
# `grep -rho '^//#region node_modules/[^/]*' <openclaw>/dist | sort -u` before
# reading a green scan as a fixed gateway.
#
# Known open case, zod GHSA-mrhx-c7xc-m3w5 (high, memory exhaustion while
# validating oversized constrained collections; fixed in 4.6.6), triaged
# 2026-10-24: openclaw@2026.7.1-2 inlines zod 4.4.3
# (dist/schemas-*.js, `version = { major: 4, minor: 4, patch: 3 }`); re-checked
# 2026-11-05 on 2026.9.2, still 4.4.3 (dist/worker/worker.mjs and
# dist/control-ui/assets/config-runtime-*.js), and that
# copy validates openclaw's own config and plugin schemas. The root override
# `openclaw>zod@<4.6.6` still matters — @modelcontextprotocol/sdk and
# @agentclientprotocol/sdk, which openclaw imports rather than inlines, resolve
# zod through openclaw and loaded 4.4.3 before it — but it cannot reach the
# inlined copy, and no scanner can see that copy. Upstream has fixed it:
# openclaw main pins zod 4.6.7, and 2026.9.34 (extended-stable, 2026-10-24)
# inlines 4.6.7 — but that line requires Node >=24.22.1, so adopting it is the
# repo-wide Node bump, not a routine pin move. 2026.10.7 (latest) and
# 2026.10.10-beta.3 still pin 4.6.5. Exposure meanwhile is bounded: the gateway
# is reachable only on the Docker-internal network, and the config it
# validates is written by Pinchy. Re-check on every OpenClaw bump
# (update-openclaw): this note retires when the inlined version is >= 4.6.6. Still outside the lockfile
# in that image: the llama-cpp provider (`openclaw plugins install`, npm) and
# the /opt/pinchy-*-deps bundles (npm install of each plugin's package.json) —
# a scan here says nothing about those.
#
# MAL-2026-3432, GHSA-w5hq-g745-h8pq (uuid) and GHSA-q8mj-m7cp-5q26 (qs) were
# dropped 2026-07-21, and GHSA-v2v4-37r5-5v8g (with MAL-2026-3432 as its alias)
# on 2026-10-17: osv-scanner reported each of them as UNUSED (fail-on-unused) —
# no lockfile package matches them anymore. Re-add with a fresh reason if
# osv-scanner flags any of them again.

# The five astro advisories (GHSA-4g3v-8h47-v7g6, GHSA-7pw4-f3q4-r2p2,
# GHSA-f48w-9m4c-m7f5, GHSA-26w7-cxv4-gfx2, GHSA-376h-93r7-7g6f) were retired
# 2026-10-19 by the docs' move to astro 7 + Starlight 0.42 (#851), which ships
# every fix; osv-scanner reports none of them against docs/pnpm-lock.yaml.

# GHSA-mh99-v99m-4gvg (brace-expansion OOM) was retired 2026-10-17. The
# root package.json overrides now lift every line past its fix (1.x >=1.1.21,
# 2.x >=2.1.7, 5.x >=5.0.12), osv-scanner reported the entry as UNUSED, and
# `pnpm audit --audit-level=high --prod` passes without its `ignoreGhsas`
# mirror. The OpenClaw image's plugin installs (`npm install`, no lockfile, no
# overrides) are fixed too, because each line's newest patch is the fixed one
# and the consumers' ranges reach it. Should brace-expansion be flagged again,
# the acceptance needs both halves back — an entry here AND in
# `pnpm.auditConfig.ignoreGhsas` — which scripts/lib/audit-ignore-parity
# .test.mjs (`pnpm test:scripts`) enforces.

# GHSA-vfj7-8cjw-p6xm (braces) and GHSA-hp3w-g68c-fv3c (sprintf-js) were
# retired 2026-11-01: GitHub withdrew both advisories (2026-10-22/23), osv-scanner
# reported the entries as UNUSED (it exits 1 on that), and neither package is
# flagged any more. Re-add with a fresh reason if either comes back.

# A medium DoS advisory published 2026-10-27, fixed only in a major openclaw
# does not declare: minimatch GHSA-g3hv-75wg-m249 (fixed 11.0.1). GitHub
# narrowed it to >=7.0.0 on 2026-11-04, so eslint's minimatch@3 and
# readdir-glob's @5 are outside it; the one copy in range is 10.2.6, which
# openclaw pins EXACTLY and openclaw-runtime-closure.test.ts refuses to see
# moved across a major. It is not in the range `pnpm audit
# --audit-level=high --prod` fails on, so it needs no `ignoreGhsas` mirror.
#
# Its sibling, glob GHSA-3g3m-2fjr-6pw4 (>=9.0.0 <=14.0.1), was retired
# 2026-11-24: the only copy in range was glob@10.5.0 under rimraf@5, which left
# with gaxios 8, and the remaining glob@7.2.3 (exceljs) is below the range.
#
# Reachability, which is the criterion (see the docs-only entry below): the
# amplification is in firstPhasePreProcess() at optimizationLevel >= 2, and
# minimatch defaults to 1. openclaw imports minimatch (not inlined) and calls it
# with `{ dot: true }` / `{ nocase: true }` on tool-policy and model-id
# patterns, level 1, over patterns from config and code. No pattern reaches it
# from an unauthenticated request. ignoreUntil forces the question again once
# openclaw moves.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-15
reason = "minimatch >=7.0.0 <11.0.1 (resolved 10.2.6), globparts amplification in firstPhasePreProcess() at optimizationLevel >= 2 (medium); fixed only in 11.0.1, outside the exact version openclaw pins. openclaw is the only route: it imports minimatch and calls it at the default optimizationLevel 1 with config- and code-authored tool-policy and model-id patterns. No request-supplied pattern reaches it."

# picomatch has no fixed release at all (every version <= 4.0.7 is affected),
# so there is nothing to bump to. The ReDoS needs an attacker-chosen glob
# pattern; no pattern from a request reaches any copy. It is high severity and
# sits in the prod tree, so pnpm audit sees it too: the id is mirrored in
# pnpm.auditConfig.ignoreGhsas, and the parity guard holds the two together.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-15
reason = "picomatch <=4.0.7, ReDoS through single-branch repeated extglobs (high); no patched version exists. Exploiting it requires the attacker to supply the glob pattern, and none of ours comes from request input. Our source does not import picomatch. The prod-tree copies arrive only via better-auth's optional peer vitest (vitest, vite, tinyglobby, fdir): test tooling the server never loads. Next.js' compiled copy matches patterns from next.config. Dev-only routes in pnpm-lock.yaml match repo-authored config globs: @typescript-eslint/parser, eslint-config-next, micromatch (lint-staged, fast-glob). docs/pnpm-lock.yaml routes run only at astro build time over repo-authored globs: @astrojs/internal-helpers, @astrojs/starlight, anymatch (chokidar in the dev server)."

# A docs-build-only advisory whose fix exists only in a major the consuming
# package does not declare. Overriding past the declared range was tried (#1222)
# and rejected: it pins versions mermaid / expressive-code never tested. The
# criterion is reachability, not the override itself: the root package.json does
# force node-llama-cpp's simple-git past its declared ^3, because node-llama-cpp
# ships in the Pinchy image and 4.x was verified against its call sites (#1222).
# The docs advisory is unreachable, so an expiring
# acceptance is the smaller risk than an untested pin. Re-triage when expressive-code
# moves postcss-nested to postcss-selector-parser 7. Its katex sibling
# (GHSA-238p-pmpm-9mq7) was retired 2026-11-24: mermaid 12 resolves katex 0.18.10.
#
# Related, recorded here so the next triage starts from it: docs resolves
# http-cache-semantics 4.3.0, which is OUTSIDE GHSA-ch52-4w7c-c8xp's published
# range (<= 4.2.0) but does NOT fix it — 4.2.0..4.3.0 upstream only touches Vary
# handling; max-stale still serves a zeroed shared Set-Cookie response. If the
# advisory is widened to cover 4.3.0, accept it on the same grounds: astro uses
# it for its build-time remote-image cache, a private cache with no user cookies.

[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
ignoreUntil = 2027-01-15
reason = "postcss-selector-parser <7.1.6 quadratic selector parsing (medium), docs/pnpm-lock.yaml only, via @astrojs/starlight > astro-expressive-code > @expressive-code/core > postcss-nested@6 (declares ^6.1.1). It parses expressive-code's own code-block theme CSS at docs build time; no untrusted selector reaches it and nothing ships it to a user. Fix exists only in 7.x, outside postcss-nested's declared range."
