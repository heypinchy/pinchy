# OSV Scanner configuration
# https://google.github.io/osv-scanner/configuration/

# Vulnerabilities in devDependencies that do not ship in the production Docker
# image. These packages are only present in the lockfile because
# openclaw (added as a devDependency for the schema-validation
# integration test) pulls them in.
#
# Careful: the SAME openclaw version is also the runtime of the OpenClaw image,
# which installs it with `npm install -g` (Dockerfile.openclaw). That install
# reads neither this lockfile nor the root `pnpm.overrides`, and openclaw pins
# several dependencies exactly. A root override therefore clears the scanner for
# openclaw's dev tree only; the image keeps whatever openclaw pins. Before
# accepting or overriding a finding that routes through openclaw, check its
# pinned version (`npm view openclaw@<version> dependencies`) — the real fix
# for those is an openclaw bump (update-openclaw skill).
#
# MAL-2026-3432, GHSA-w5hq-g745-h8pq (uuid) and GHSA-q8mj-m7cp-5q26 (qs) were
# dropped 2026-07-21, and GHSA-v2v4-37r5-5v8g (with MAL-2026-3432 as its alias)
# on 2026-10-17: osv-scanner reported each of them as UNUSED (fail-on-unused) —
# no lockfile package matches them anymore. Re-add with a fresh reason if
# osv-scanner flags any of them again.

# astro (docs/pnpm-lock.yaml) is the static-site generator that builds the
# documentation site AT BUILD TIME. It ships in no runtime image and reaches no
# Pinchy user. Beyond that, none of the residual advisories reaches the site we
# ship: three are XSS bugs and one an authorization bypass in base-path
# stripping, all scoped upstream to on-demand SSR / the dev server — statically
# prerendered output, which is all Starlight emits, is explicitly unaffected.
# The fifth (GHSA-26w7, RCE through AVIF optimization) is a libheif bug inside
# sharp: the build never optimizes an image (passthroughImageService, below),
# and the vulnerable code is patched regardless, because docs/package.json
# forces sharp >=0.35.5, past the version the upstream fix itself requires. All five fix
# only in astro 7.x — 6.4.8 is still the newest 6.x, with no backport.
# The one High-severity astro advisory (GHSA-vj59-8hwv-xxmv, 8.2) IS fixed
# here — astro is bumped to 6.4.8, resolved within the ^6 range.
#
# Re-triaged 2026-10-17 (#851). Starlight no longer blocks: 0.42 peers
# astro ^7.2.10. A trial upgrade (astro 7.4.0 + Starlight 0.42.6) builds, and
# check:anchors / check:rendered / check:llms all pass — which is precisely the
# problem, because the regression it ships is one none of them reads.
# @pasqal-io/starlight-client-mermaid 0.1.0 (still the newest) peers
# @astrojs/markdown-remark ^6, and under astro 7 its transform is not applied:
# the architecture diagram, emitted as <div class="mermaid"> on astro 6, comes
# out as an expressive-code block of raw Mermaid source. Astro 7 also raises the
# Node floor to >=22.22.0. Both belong in the #851 PR, not in a release-week
# dependency fix. Reachability is unchanged and re-checked against the current
# config: astro.config.mjs sets no `output` and no adapter, so every page is
# prerendered static HTML, and `image.service` is passthroughImageService, so
# the build never decodes an image through sharp at all. ignoreUntil is
# 2026-11-30 — past the v0.10.0 cut and the Noack go-live, so the #851 upgrade
# lands as its own build-verified change instead of under a deadline.

[[IgnoredVulns]]
id = "GHSA-4g3v-8h47-v7g6"
ignoreUntil = 2026-11-30
reason = "astro — docs static-site build tooling (docs/pnpm-lock.yaml), not shipped to users; reflected XSS in View Transitions, on-demand SSR / dev-server only — Starlight emits static HTML. Fixes only in astro 7.x; the upgrade is blocked by starlight-client-mermaid 0.1.0, which does not render diagrams under astro 7. Tracked: #851"

